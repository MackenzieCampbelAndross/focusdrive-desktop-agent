[package]
name = "focusdrive-desktop-agent"
version = "0.1.0"
description = "FocusDrive Desktop Agent Rust Core"
authors = ["FocusDrive Engineering"]
edition = "2021"

[lib]
name = "focusdrive_desktop_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
